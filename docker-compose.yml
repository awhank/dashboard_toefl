services:
  app:
    build: .
    container_name: dashboard_toefl
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    networks:
      - dashboard_toefl_net

  web:
    image: nginx:alpine
    container_name: dashboard_toefl_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default/conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dashboard_toefl_net
  
  db:
    image: mysql:8.0
    container_name: dashboard_toefl_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
    volumes:
      - dashboard_toefl_db_data:/var/lib/mysql
    networks:
      - dashboard_toefl_net

volumes:
  dashboard_toefl_db_data:

networks:
  dashboard_toefl_net:
    driver: bridge
